name: Icons Dev Release
run-name: Icons Release - dev release version

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for OIDC

env:
  CI: true

jobs:
  dev-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: icons

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: icons/.node-version
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: icons/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Resolve version
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Publish `@bcc-code/icons`
        run: |
          pnpm version 0.0.0-dev.${{ env.sha_short }} --no-git-tag-version --no-git-checks
          pnpm pkg delete engines # pnpm-only engines guard this repo, not consumers
          pnpm publish --tag dev --no-git-checks

      - name: Publish `@bcc-code/icons-vue`
        working-directory: icons/vue
        run: |
          pnpm version 0.0.0-dev.${{ env.sha_short }} --no-git-tag-version --no-git-checks
          pnpm pkg delete engines # pnpm-only engines guard this repo, not consumers
          pnpm publish --tag dev --no-git-checks
