name: "Component Library: Dev Release"
run-name: Component Library - dev release version

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for OIDC

env:
  CI: true

jobs:
  test-dev-build:
    uses: ./.github/workflows/design-library-tests.yml

  dev-build:
    needs: test-dev-build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: component-library

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: component-library/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Restore cached build outputs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          fail-on-cache-miss: true
          path: |
            component-library/dist
            component-library/dist-types
            component-library/dist-css
          key: component-library-dist-${{ steps.vars.outputs.sha_short }}

      - name: Publish `@bcc-code/component-library-vue`
        run: |
          pnpm version 0.0.0-dev.${{ steps.vars.outputs.sha_short }} --no-git-tag-version --no-git-checks
          pnpm pkg delete engines # pnpm-only engines guard this repo, not consumers
          pnpm publish --tag dev --no-git-checks
