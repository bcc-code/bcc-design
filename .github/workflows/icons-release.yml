name: Icons Release
run-name: Icons Release - main release version

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for OIDC

env:
  CI: true

jobs:
  main-build:
    if: github.event_name == 'release' && contains(github.event.release.name, 'icons')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: icons

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: icons/.node-version
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: icons/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Set release channel
        id: release_channel
        run: |
          channel="$(pnpm --silent run release-channel)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Publish `@bcc-code/icons`
        run: |
          pnpm pkg delete engines # pnpm-only engines guard this repo, not consumers
          pnpm publish --tag ${{ steps.release_channel.outputs.channel }} --no-git-checks

      - name: Publish `@bcc-code/icons-vue`
        working-directory: icons/vue
        run: |
          pnpm pkg delete engines
          pnpm publish --tag ${{ steps.release_channel.outputs.channel }} --no-git-checks
