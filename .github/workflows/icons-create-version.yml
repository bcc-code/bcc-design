name: Create New Icons Version
run-name: Create new ${{ github.event.inputs.version }} ${{ github.event.inputs.channel }} icons version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor
      channel:
        description: Channel
        type: choice
        options:
          - release
          - beta
        default: release

env:
  CI: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.BCC_BOT_ACCESS_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: icons/.node-version
          registry-url: "https://registry.npmjs.org"

      - name: Set commit author to bcc-bot
        run: |
          git config --global user.name "bcc-bot"
          git config --global user.email "84040471+bcc-bot@users.noreply.github.com"

      - name: Version new ${{ github.event.inputs.version }} version
        run: pnpm run create-version ${{ github.event.inputs.version }} ${{ github.event.inputs.channel }}
        working-directory: icons

      - name: Push
        run: git push --follow-tags
